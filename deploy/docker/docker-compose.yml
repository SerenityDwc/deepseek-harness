# =============================================================================
# deepseek-harness:v1.0.1
#
# Usage:
#   1. Copy .env.example to .env and fill keys
#   2. powershell -File build.ps1
#   3. docker compose -f docker-compose.yml --env-file .env up -d
# Access: http://<host>:3080  (TRUSTED_HOSTS must match the browser Host)
# =============================================================================
name: deepseek-harness

services:
  dsh:
    image: deepseek-harness:v1.0.1
    container_name: deepseek-harness
    restart: unless-stopped
    ports:
      - "${PORT:-3080}:3080"
    environment:
      - PORT=3080
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-}
      - SHENSUANYUN_API_KEY=${SHENSUANYUN_API_KEY:-}
      - ZAI_CODING_CN_API_KEY=${ZAI_CODING_CN_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - BDA_AUTH_USER=${BDA_AUTH_USER:-}
      - AUTH_ADMIN_KEY=${AUTH_ADMIN_KEY:-}
      - BDA_AUTH_BASE_URL=${BDA_AUTH_BASE_URL:-}
      - BDA_API_BASE_URL=${BDA_API_BASE_URL:-}
      - WEKNORA_BASE_URL=${WEKNORA_BASE_URL:-}
      - WEKNORA_API_KEY=${WEKNORA_API_KEY:-}
    volumes:
      - dsh-home:/srv/dsh/user

volumes:
  dsh-home:
