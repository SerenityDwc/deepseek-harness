# Bind the webserver to all interfaces so Docker port publishing works.
# The CLI forbids a literal --host 0.0.0.0; overriding the webserver row is the
# supported deployment path (see packages/bundle/web-app/cordis.patch.yml).
- id: webserver
  config:
    host: 0.0.0.0
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
